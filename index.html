<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Garage Manager</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#14202b;--mut:#64748b;--br:#e2e8f0;--pri:#0f766e;--onpri:#fff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--c-carburante:#f59e0b;--c-acquisto:#8b5cf6;--c-fissa:#3b82f6;--c-manutenzione:#10b981;--c-multa:#ef4444;--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#0b1218;--card:#141e27;--tx:#e6edf3;--mut:#8b9bab;--br:#24323f;--pri:#2dd4bf;--onpri:#04201d}}
*{box-sizing:border-box;touch-action:pan-x pan-y}
html,body{touch-action:pan-x pan-y}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:baseline;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 16px 10px;max-width:760px;margin:0 auto}
.top h1{margin:0;font-size:1.35rem}
.ver{color:var(--mut);font-size:.75rem}
main{max-width:760px;margin:0 auto;padding:0 16px 16px}
h3{margin:0 0 6px;font-size:1.05rem}
.card{background:var(--card);border:1px solid var(--br);border-radius:var(--r);padding:14px;margin:0 0 12px}
.card.ok{border-color:var(--ok)}
.mut{color:var(--mut)}.small{font-size:.85rem}.center{text-align:center}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row.gap{justify-content:flex-start;flex-wrap:wrap;margin-top:8px}
.row.end{justify-content:flex-end}
.btn{appearance:none;border:0;background:var(--pri);color:var(--onpri);font:inherit;font-weight:600;padding:11px 16px;border-radius:12px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--br)}
.btn.sm{padding:7px 12px;font-size:.9rem}
.btn.full{width:100%;margin-bottom:12px}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5}
.lnk{background:none;border:0;color:var(--pri);font:inherit;font-size:.9rem;padding:4px 2px;cursor:pointer}
.lnk.bad{color:var(--bad)}
.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--br);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
.bottom button{flex:1;max-width:140px;background:none;border:0;color:var(--mut);font:inherit;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;cursor:pointer}
.bottom button span{font-size:1.3rem;line-height:1}
.bottom button.on{color:var(--pri);font-weight:700}
select,input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--br);border-radius:10px;padding:10px}
.vbar{margin-bottom:12px}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;border:1px solid var(--br);background:var(--card);color:var(--tx);font:inherit;font-size:.9rem;cursor:pointer}
.seg button.on{background:var(--pri);color:var(--onpri);border-color:var(--pri);font-weight:600}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.kpis div{background:var(--bg);border-radius:10px;padding:10px}
.kpis b{display:block;font-size:1.1rem}
.kpis span{font-size:.75rem;color:var(--mut)}
.tco{display:flex;height:12px;border-radius:8px;overflow:hidden;background:var(--br);margin:8px 0}
.tco i{display:block;height:100%}
.c-carburante{background:var(--c-carburante)}.c-acquisto{background:var(--c-acquisto)}.c-fissa{background:var(--c-fissa)}.c-manutenzione{background:var(--c-manutenzione)}.c-multa{background:var(--c-multa)}
.leg{list-style:none;margin:0;padding:0;font-size:.88rem}
.leg li{display:flex;align-items:center;gap:8px;padding:2px 0}
.leg li i{width:10px;height:10px;border-radius:3px;flex:none}
.leg li b{margin-left:auto}
.al{padding:8px 10px;border-radius:10px;margin-top:6px;font-size:.92rem;border-left:4px solid var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.al.late{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.bar{height:10px;background:var(--br);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;border-radius:6px}
.bar i.ok,.pill.ok{background:var(--ok)}.bar i.warn,.pill.warn{background:var(--warn)}.bar i.late,.pill.late{background:var(--bad)}
.pill{color:#fff;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px}
.amt{white-space:nowrap}
.badge{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:99px;border:1px solid var(--br);color:var(--mut)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal.hidden{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sh-h h2{margin:0;font-size:1.15rem}
.x{background:none;border:0;color:var(--mut);font-size:1.2rem;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--mut)}
.fld.w2,.chk,.btns,.note{grid-column:1/-1}
.chk{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:.95rem}
.chk input{width:auto}
.chkgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:4px 0 8px}
.chkgrid .chk{grid-column:auto}
.addpart{display:flex;gap:8px}
.addpart input{flex:1;min-width:0}
.btns{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:#111c;color:#fff;padding:10px 16px;border-radius:99px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;backdrop-filter:blur(6px);max-width:92vw;text-align:center}
#toast.on{opacity:1}
.seg.sm button{font-size:.8rem;padding:8px 4px}
.sortlbl{font-size:.78rem;color:var(--mut);margin:0 0 4px}
.sumline{font-size:.85rem;color:var(--mut);margin:0 0 8px}
.sectitle{font-weight:700;font-size:1.1rem;margin:2px 0}
</style>
</head>
<body>
<header class="top"><h1>🚗 Garage Manager</h1><span class="ver" id="ver"></span></header>
<main id="view"></main>
<nav class="bottom" id="nav"></nav>
<div id="modal" class="modal hidden"></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>
<script>
'use strict';
const VERSION='0.4.1';
const KEY='garageManager.db';
const TIPI=['Auto','Moto','Scooter','Furgone','Altro'];
const ICON={Auto:'🚗',Moto:'🏍️',Scooter:'🛵',Furgone:'🚐',Altro:'🚙'};
const ALIM=['Benzina','Diesel','Elettrica','Ibrida','GPL','Metano'];
/* Categorie di spesa (g = gruppo per statistiche / TCO). legacy = solo dati importati da v0.1.x */
const CATS={
  acquisto:{l:'Acquisto veicolo',g:'acquisto'},
  rata:{l:'Rata veicolo',g:'acquisto'},
  assicurazione:{l:'Assicurazione veicolo',g:'fissa'},
  bollo:{l:'Tassa veicolo (Bollo)',g:'fissa'},
  multa:{l:'Multa',g:'multa'},
  revisione:{l:'Revisione veicolo',g:'fissa'},
  manutenzione:{l:'Manutenzione',g:'manutenzione'},
  ctt_asi:{l:'CTT / Tessera ASI (storico)',g:'fissa',legacy:1},
  altro_fisso:{l:'Altro costo fisso (storico)',g:'fissa',legacy:1}
};
const SCAD_CATS='assicurazione,bollo,revisione,ctt_asi,altro_fisso';
const PARTS=['Olio','Candela','Cinghia','Filtro aria','Pastiglie posteriori','Pastiglie anteriori','Rulli centrifuga','Batteria'];
const LEGACY_MAN={tagliando:'Tagliando',gomme:'Gomme',freni:'Freni',altro_ord:null,riparazione:'Riparazione'};
const PRESETS=[['Cambio olio e filtro',15000,12],['Cinghia di distribuzione',100000,60],['Liquido freni',null,24],['Filtro aria',30000,36]];
/* Prezzi medi annui nazionali, usati SOLO per stimare la quantità quando manca (€/litro; metano €/kg; elettricità €/kWh) */
const PREZZI_PARZIALE=2026;
const PREZZI_FONTI='Benzina, gasolio, GPL: MASE, prezzi medi annui IVA inclusa. Metano: MIMIT (via BenzinaItalia). Elettricità: Eurostat, utenze domestiche, tasse incluse, media dei due semestri. Il 2026 è parziale (dati al 14/10/2026).';
const PREZZI={
  benzina:{2005:1.2202,2006:1.2865,2007:1.3007,2008:1.3818,2009:1.2349,2010:1.3629,2011:1.5532,2012:1.7871,2013:1.7487,2014:1.7162,2015:1.5357,2016:1.4428,2017:1.5276,2018:1.6044,2019:1.5733,2020:1.4319,2021:1.6223,2022:1.8128,2023:1.8629,2024:1.821,2025:1.7332,2026:1.8541},
  gasolio:{2005:1.1079,2006:1.1661,2007:1.1646,2008:1.3458,2009:1.0822,2010:1.2142,2011:1.4476,2012:1.7059,2013:1.6572,2014:1.6126,2015:1.406,2016:1.2805,2017:1.3825,2018:1.4909,2019:1.4789,2020:1.3176,2021:1.4838,2022:1.8141,2023:1.7911,2024:1.7166,2025:1.653,2026:1.9851},
  gpl:{2005:0.5697,2006:0.6482,2007:0.6267,2008:0.6812,2009:0.5631,2010:0.6599,2011:0.7553,2012:0.8206,2013:0.8013,2014:0.7707,2015:0.612,2016:0.5636,2017:0.6325,2018:0.6746,2019:0.6323,2020:0.6054,2021:0.7042,2022:0.8143,2023:0.7492,2024:0.7239,2025:0.7158,2026:0.7549},
  metano:{2014:0.992,2015:0.989,2016:0.983,2017:0.968,2018:0.972,2019:0.997,2020:0.98,2021:1.182,2022:2.097,2023:1.586,2024:1.358,2025:1.449},
  elettrica:{2014:0.2106,2015:0.2107,2016:0.2115,2017:0.2197,2018:0.2257,2019:0.2476,2020:0.2469,2021:0.2616,2022:0.3691,2023:0.3877,2024:0.359,2025:0.3513}
};


/* ---------- utilità ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const N=v=>(v===''||v==null||isNaN(Number(v)))?null:Number(v);
const pad=n=>String(n).padStart(2,'0');
const toISO=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO=()=>toISO(new Date());
const parseISO=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const daysBetween=(a,b)=>Math.round((parseISO(b)-parseISO(a))/86400000);
const daysTo=iso=>daysBetween(todayISO(),iso);
const addMonths=(iso,n)=>{const d=parseISO(iso);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return toISO(d)};
const eur=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n||0);
const num=(n,d=1)=>new Intl.NumberFormat('it-IT',{maximumFractionDigits:d}).format(n||0);
const fdate=iso=>iso?iso.split('-').reverse().join('/'):'—';
const fmonth=m=>{if(!m)return '—';const p=m.split('-').map(Number);return new Date(p[0],p[1]-1,1).toLocaleDateString('it-IT',{month:'long',year:'numeric'})};
const vname=v=>v.marca+' '+v.modello;
const unitOf=v=>v.alimentazione==='Elettrica'?'kWh':(v.alimentazione==='Metano'?'kg':'l');
const catOf=e=>CATS[e.categoria]||{l:e.categoria,g:'manutenzione'};
function fuelKind(v){return({Benzina:'benzina',Diesel:'gasolio',GPL:'gpl',Metano:'metano',Elettrica:'elettrica',Ibrida:'benzina'})[v.alimentazione]||'benzina'}
/* prezzo medio dell'anno; se l'anno manca usa il più vicino disponibile (exact=false) */
function priceFor(v,year){
  const t=PREZZI[fuelKind(v)];if(!t)return null;
  const ys=Object.keys(t).map(Number).sort((a,b)=>a-b);
  let y=year;
  if(t[y]===undefined)y=year>ys[ys.length-1]?ys[ys.length-1]:ys[0];
  return{price:t[y],year:y,exact:y===year,partial:y===PREZZI_PARZIALE};
}
function estimateQty(v,total,year){
  const p=priceFor(v,year);
  if(!p||!(total>0))return null;
  return{q:Math.round(total/p.price*100)/100,price:p.price,year:p.year,exact:p.exact,partial:p.partial};
}
const expTitle=e=>(e.interventi&&e.interventi.length)?e.interventi.join(', '):(e.voce||catOf(e).l);

/* ---------- database ---------- */
function emptyDb(){return{app:'garage-manager',schemaVersion:2,exportedAt:null,vehicles:[],expenses:[],fuelLogs:[],rules:[],customParts:[]}}
function migrate(b){
  b.expenses.forEach(e=>{
    if(Object.prototype.hasOwnProperty.call(LEGACY_MAN,e.categoria)){
      const p=LEGACY_MAN[e.categoria];
      e.categoria='manutenzione';
      e.interventi=p?[p]:[];
      if(p&&PARTS.indexOf(p)<0&&b.customParts.indexOf(p)<0)b.customParts.push(p);
    }
    if(!Array.isArray(e.interventi))e.interventi=[];
  });
  b.fuelLogs.forEach(f=>{if(!f.tipo)f.tipo='singolo'});
  b.vehicles.forEach(v=>{if(!v.acquisto||typeof v.acquisto!=='object')v.acquisto={modo:''}});
  b.schemaVersion=2;
  return b;
}
function normalize(o){
  const b=emptyDb();
  ['vehicles','expenses','fuelLogs','rules'].forEach(k=>{b[k]=Array.isArray(o[k])?o[k]:[]});
  b.customParts=Array.isArray(o.customParts)?o.customParts.filter(s=>typeof s==='string'&&s.trim()):[];
  return migrate(b);
}
function loadDb(){try{const r=localStorage.getItem(KEY);if(r)return normalize(JSON.parse(r))}catch(e){console.error(e)}return emptyDb()}
let db=loadDb();
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Errore di salvataggio: spazio esaurito?')}}
let ui={tab:'dashboard',vid:null,reg:'man',sortSpese:'dd',sortFuel:'dd',sortRegole:'su'};
function curV(){if(!db.vehicles.find(v=>v.id===ui.vid))ui.vid=db.vehicles.length?db.vehicles[0].id:null;return db.vehicles.find(v=>v.id===ui.vid)}
function bumpKm(v,km){if(km&&km>v.km){v.km=km;v.kmData=todayISO()}}

/* ---------- calcoli ---------- */
function consumption(fl){
  // solo rifornimenti singoli con quantità reale e km: totali mensili/annuali e quantità stimate restano esclusi
  const s=fl.filter(f=>(!f.tipo||f.tipo==='singolo')&&!f.stimato&&f.km>0&&f.quantita>0).sort((a,b)=>a.km-b.km);
  const fulls=s.filter(f=>f.pieno);
  if(fulls.length<2)return null;
  const a=fulls[0],b=fulls[fulls.length-1];
  const dist=b.km-a.km;if(dist<=0)return null;
  const q=s.filter(f=>f.km>a.km&&f.km<=b.km).reduce((t,f)=>t+f.quantita,0);
  if(q<=0)return null;
  return{per100:q/dist*100,kmPerUnit:dist/q};
}
/* quota di un totale annuale che cade negli ultimi 12 mesi (spesa distribuita uniformemente sul periodo trascorso dell'anno) */
function annualShare(year,lim){
  const t=todayISO(),ps=year+'-01-01',pe=(year+'-12-31')<t?(year+'-12-31'):t;
  if(pe<ps)return 0;
  const st=ps>lim?ps:lim;
  if(st>pe)return 0;
  return (daysBetween(st,pe)+1)/(daysBetween(ps,pe)+1);
}
function fuel12(fl,lim){
  return fl.reduce((t,f)=>t+(f.tipo==='annuale'?(f.totale||0)*annualShare(f.anno,lim):(f.data>=lim?(f.totale||0):0)),0);
}
function stats(v){
  const ex=db.expenses.filter(e=>e.vehicleId===v.id),fl=db.fuelLogs.filter(f=>f.vehicleId===v.id);
  const by={carburante:0,acquisto:0,fissa:0,manutenzione:0,multa:0};
  fl.forEach(f=>{by.carburante+=f.totale||0});
  const hasAcq=!!(v.acquisto&&v.acquisto.modo),ap=hasAcq?acquistoPayments(v):[];
  ex.forEach(e=>{const g=catOf(e).g;if(g==='acquisto'&&hasAcq)return;by[g]=(by[g]||0)+(e.costo||0)});
  ap.forEach(p=>{by.acquisto+=p.amt});
  const total=Object.keys(by).reduce((t,k)=>t+by[k],0);
  const dates=ex.map(e=>e.data).concat(fl.map(f=>f.data)).concat(ap.map(p=>p.d)).filter(Boolean).sort();
  let perMonth=null;
  if(dates.length){const months=Math.max(1,daysBetween(dates[0],todayISO())/30.44);perMonth=total/months}
  const lim=toISO(new Date(Date.now()-365*86400000));
  const last12=ex.filter(e=>e.data>=lim&&!(hasAcq&&catOf(e).g==='acquisto')).reduce((t,e)=>t+(e.costo||0),0)+fuel12(fl,lim)+ap.filter(p=>p.d&&p.d>=lim).reduce((t,p)=>t+p.amt,0);
  const kms=ex.map(e=>e.km).concat(fl.map(f=>f.km)).filter(k=>k>0);
  let perKm=null;
  if(kms.length){const d=v.km-Math.min.apply(null,kms);if(d>0)perKm=total/d}
  return{by,total,perMonth,last12,perKm,cons:consumption(fl)};
}
function acquistoInfo(v){
  const a=v.acquisto||{};
  const dt=a.dataAcquisto?' (del '+fdate(a.dataAcquisto)+')':'';
  if(a.modo==='unico'&&a.importo!=null)return{tot:a.importo,txt:'Pagamento unico: '+eur(a.importo)+dt};
  if(a.modo==='finanziamento'){
    const tot=(a.anticipo||0)+(a.rate||0)*(a.importoRata||0)+(a.maxirata||0);
    return{tot:tot,txt:'Finanziamento'+dt+': '+(a.anticipo?'anticipo '+eur(a.anticipo)+' + ':'')+(a.rate||0)+' rate × '+eur(a.importoRata)+(a.maxirata?' + maxi-rata '+eur(a.maxirata):'')+' = '+eur(tot)};
  }
  return null;
}
function acquistoPayments(v){
  // pagamenti d'acquisto già maturati fino ad oggi
  const a=v.acquisto||{},t=todayISO(),pay=[];
  if(a.modo==='unico'&&a.importo!=null){
    if(!a.dataAcquisto||a.dataAcquisto<=t)pay.push({d:a.dataAcquisto||null,amt:a.importo,k:'unico'});
  }else if(a.modo==='finanziamento'){
    if(a.anticipo&&(!a.dataAcquisto||a.dataAcquisto<=t))pay.push({d:a.dataAcquisto||null,amt:a.anticipo,k:'anticipo'});
    const n=a.rate||0,start=a.dataPrimaRata||(a.dataAcquisto?addMonths(a.dataAcquisto,1):null);
    let done=0;
    if(start)for(let i=0;i<n;i++){const d=addMonths(start,i);if(d>t)break;done++;pay.push({d:d,amt:a.importoRata||0,k:'rata'})}
    if(start&&n>0&&done>=n&&a.maxirata)pay.push({d:addMonths(start,n-1),amt:a.maxirata,k:'maxi'});
  }
  return pay;
}
function acquistoSummary(v){
  const a=v.acquisto||{};
  if(!a.modo)return null;
  const pay=acquistoPayments(v);
  return{pay:pay,tot:pay.reduce((t,p)=>t+p.amt,0),done:pay.filter(p=>p.k==='rata').length,n:a.rate||0,noDate:a.modo==='finanziamento'&&!(a.dataPrimaRata||a.dataAcquisto)};
}
function ruleStatus(r,v){
  let remKm=null,remDays=null,pctKm=0,pctT=0,nextDate=null;
  if(r.ogniKm){remKm=(r.ultimoKm||0)+r.ogniKm-v.km;pctKm=(v.km-(r.ultimoKm||0))/r.ogniKm*100}
  if(r.ogniMesi&&r.ultimaData){nextDate=addMonths(r.ultimaData,r.ogniMesi);remDays=daysTo(nextDate);const tot=Math.max(1,daysBetween(r.ultimaData,nextDate));pctT=(tot-remDays)/tot*100}
  const pct=Math.max(pctKm,pctT);
  let st='ok';
  if((remKm!==null&&remKm<=0)||(remDays!==null&&remDays<=0))st='late';
  else if(pct>=85||(remKm!==null&&remKm<=1000)||(remDays!==null&&remDays<=30))st='warn';
  return{remKm,remDays,nextDate,st,raw:pct,pct:Math.max(0,Math.min(100,pct))};
}
function alerts(v){
  const out=[];
  const last={};
  db.expenses.filter(e=>e.vehicleId===v.id&&e.scadenza&&catOf(e).g==='fissa').forEach(e=>{
    if(!last[e.categoria]||e.scadenza>last[e.categoria].scadenza)last[e.categoria]=e;
  });
  Object.keys(last).forEach(k=>{
    const d=daysTo(last[k].scadenza),n=CATS[k].l;
    if(d<0)out.push({sev:'late',text:n+': scaduto da '+(-d)+' giorni'});
    else if(d<=30)out.push({sev:'warn',text:n+': in scadenza tra '+d+(d===1?' giorno':' giorni')});
  });
  db.rules.filter(r=>r.vehicleId===v.id).forEach(r=>{
    const s=ruleStatus(r,v);
    if(s.st==='ok')return;
    const p=[];
    if(s.remKm!==null)p.push(s.remKm>=0?'tra '+num(s.remKm,0)+' km':'superato di '+num(-s.remKm,0)+' km');
    if(s.remDays!==null)p.push(s.remDays>=0?'tra '+s.remDays+' giorni':'scaduto da '+(-s.remDays)+' giorni');
    out.push({sev:s.st,text:r.nome+': '+p.join(' / ')});
  });
  return out;
}

let toastT;

function closeModal(){const m=$('#modal');m.classList.add('hidden');m.innerHTML=''}
function whenAttr(f){return f.when?' data-wn="'+f.when[0]+'" data-wv="'+f.when[1]+'"':''}
function partChk(p,on){return'<label class="chk"><input type="checkbox" name="parts" value="'+esc(p)+'"'+(on?' checked':'')+'> '+esc(p)+'</label>'}
function partsBlock(f){
  const sel=f.v||[];

function field(f){
  if(f.t==='parts')return partsBlock(f);
  if(f.t==='hidden')return'<input type="hidden" name="'+f.n+'" value="'+esc(f.v)+'">';
  if(f.t==='note')return'<div class="note mut small"'+whenAttr(f)+'>'+esc(f.l)+'</div>';
  const v=f.v==null?'':f.v,req=f.req?' required':'',w=f.w===2?' w2':'';
  if(f.t==='checkbox')return'<label class="chk"'+whenAttr(f)+'><input type="checkbox" name="'+f.n+'"'+(f.v?' checked':'')+'> '+esc(f.l)+'</label>';
  let inp;
  if(f.t==='select'){
    inp='<select name="'+f.n+'"'+req+'>'+f.opts.map(o=>{const a=Array.isArray(o)?o:[o,o];return'<option value="'+esc(a[0])+'"'+(String(a[0])===String(v)?' selected':'')+'>'+esc(a[1])+'</option>'}).join('')+'</select>';
  }else if(f.t==='textarea'){
    inp='<textarea name="'+f.n+'" rows="2">'+esc(v)+'</textarea>';
  }else{
    inp='<input name="'+f.n+'" type="'+(f.t||'text')+'" value="'+esc(v)+'"'+(f.t==='number'?' step="'+(f.step||'any')+'" inputmode="decimal"':'')+req+'>';
  }
  return'<label class="fld'+w+'"'+whenAttr(f)+'><span>'+esc(f.l)+'</span>'+inp+'</label>';
}
function applyWhen(form){
  form.querySelectorAll('[data-wn]').forEach(el=>{
    const ctl=form.elements[el.dataset.wn];
    const show=!!ctl&&el.dataset.wv.split(',').indexOf(ctl.value)>=0;
    el.hidden=!show;
    el.querySelectorAll('input,select,textarea,button').forEach(i=>{i.disabled=!show});
  });
}
function openForm(title,fields,onSubmit,submit){
  const m=$('#modal');
  m.innerHTML='<div class="sheet"><div class="sh-h"><h2>'+esc(title)+'</h2><button type="button" class="x" data-act="closeModal">✕</button></div><form id="mf" class="grid" novalidate>'+fields.map(field).join('')+'<div class="btns"><button type="button" class="btn ghost" data-act="closeModal">Annulla</button><button class="btn">'+esc(submit||'Salva')+'</button></div></form></div>';
  m.classList.remove('hidden');
  const form=$('#mf');
  applyWhen(form);
  form.addEventListener('change',()=>applyWhen(form));
  form.addEventListener('submit',e=>{
    e.preventDefault();
    if(!form.checkValidity()){form.reportValidity();return}
    const fd=new FormData(form),o={};
    fields.forEach(f=>{
      if(!f.n)return;
      if(f.t==='checkbox')o[f.n]=fd.has(f.n);
      else if(f.t==='parts')o[f.n]=fd.getAll(f.n);
      else o[f.n]=fd.get(f.n)==null?'':fd.get(f.n);
    });
    if(onSubmit(o)!==false)closeModal();
  });
}

const SORTS=[['dd','📅 Recenti'],['da','📅 Vecchie'],['id','€ Più care'],['ia','€ Meno care']];
function sortList(list,mode,dk,ak){
  const d=x=>x[dk]||'',a=x=>x[ak]||0;
  const cmp={
    dd:(x,y)=>d(y).localeCompare(d(x))||a(y)-a(x),
    da:(x,y)=>d(x).localeCompare(d(y))||a(x)-a(y),
    id:(x,y)=>a(y)-a(x)||d(y).localeCompare(d(x)),
    ia:(x,y)=>a(x)-a(y)||d(y).localeCompare(d(x))
  }[mode]||((x,y)=>d(y).localeCompare(d(x)));
  return list.slice().sort(cmp);
}

/* ---- collegamento manutenzione -> regole ---- */
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim()}
const PART_KEYS={'olio':['olio'],'candela':['candel'],'cinghia':['cinghia'],'filtro aria':['filtro aria','filtro dell aria','filtro d aria'],'pastiglie posteriori':['pastiglie post','freni post'],'pastiglie anteriori':['pastiglie ant','freni ant'],'rulli centrifuga':['rulli'],'batteria':['batteria']};
function ruleMatchesPart(rule,part){
  const n=norm(rule.nome),p=norm(part);
  if(!n||!p)return false;
  if((PART_KEYS[p]||[p]).some(k=>n.indexOf(k)>=0))return true;
  if((p==='pastiglie posteriori'||p==='pastiglie anteriori')&&n.indexOf('pastiglie')>=0&&!/(ant|post)/.test(n))return true;
  return p.length>=4&&n.length>=4&&p.indexOf(n)>=0;
}
/* azzera le regole corrispondenti agli interventi registrati; una regola non viene mai riportata indietro nel tempo */
function applyMaintenanceToRules(v,e){
  const out=[];
  if(!e.interventi||!e.interventi.length||!e.data)return out;
  db.rules.filter(r=>r.vehicleId===v.id).forEach(r=>{
    if(!e.interventi.some(p=>ruleMatchesPart(r,p)))return;
    if(r.ultimaData&&e.data<r.ultimaData)return;
    r.ultimaData=e.data;
    const km=e.km>0?e.km:(e.data===todayISO()?v.km:null);
    if(km!=null)r.ultimoKm=km;
    out.push(r.nome+(r.ogniKm&&km==null?' (km non indicati: contatore km invariato)':''));
  });
  return out;
}

function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}

function importFile(file){

    try{
      const o=JSON.parse(r.result);
      if(o.app!=='garage-manager'||!Array.isArray(o.vehicles))throw new Error('il file non è un backup di Garage Manager');
      const n=normalize(o);
      const ok=e=>n.vehicles.some(v=>v.id===e.vehicleId);
      n.expenses=n.expenses.filter(ok);n.fuelLogs=n.fuelLogs.filter(ok);n.rules=n.rules.filter(ok);
      if(!confirm('Il backup contiene '+n.vehicles.length+' veicoli, '+n.expenses.length+' spese, '+n.fuelLogs.length+' rifornimenti, '+n.rules.length+' regole.\n\nSostituire TUTTI i dati attuali?'))return;

      db=n;ui.vid=null;save();render();toast('Backup ripristinato');

  };
  r.readAsText(file);
}

/* generatore PDF minimale (Helvetica, A4, solo testo): nessuna libreria esterna, funziona offline */
const HW={' ':278,'!':278,'"':355,'#':556,'$':556,'%':889,'&':667,"'":191,'(':333,')':333,'*':389,'+':584,',':278,'-':333,'.':278,'/':278,':':278,';':278,'<':584,'=':584,'>':584,'?':556,'@':1015,'A':667,'B':667,'C':722,'D':722,'E':667,'F':611,'G':778,'H':722,'I':278,'J':500,'K':667,'L':556,'M':833,'N':722,'O':778,'P':667,'Q':778,'R':722,'S':667,'T':611,'U':722,'V':667,'W':944,'X':667,'Y':667,'Z':611,'[':278,'\\':278,']':278,'^':469,'_':556,'`':333,'a':556,'b':556,'c':500,'d':556,'e':556,'f':278,'g':556,'h':556,'i':222,'j':222,'k':500,'l':222,'m':833,'n':556,'o':556,'p':556,'q':556,'r':333,'s':500,'t':278,'u':556,'v':500,'w':722,'x':500,'y':500,'z':500,'{':334,'|':260,'}':334,'~':584};
function tw(s,size,bold){let w=0;for(const ch of s)w+=(HW[ch]||556);return w*size/1000*(bold?1.06:1)}
function pdfStr(s){
  let o='';
  for(const ch of String(s==null?'':s)){
    const c=ch.charCodeAt(0);
    if(ch==='\\'||ch==='('||ch===')')o+='\\'+ch;
    else if(ch==='€')o+='\x80';
    else if(ch==='–'||ch==='—')o+='-';
    else if(ch==='’'||ch==='‘')o+="'";
    else if(ch==='“'||ch==='”')o+='"';
    else if(c<32)o+=' ';
    else if(c<256)o+=ch;
    else o+='?';
  }
  return o;
}
function wrapText(s,w,size,bold){
  const pieces=[];
  String(s==null?'':s).split(/\s+/).filter(Boolean).forEach(wd=>{
    if(tw(wd,size,bold)<=w){pieces.push(wd);return}
    let c='';
    for(const ch of wd){if(tw(c+ch,size,bold)>w&&c){pieces.push(c);c=ch}else c+=ch}
    if(c)pieces.push(c);
  });
  const lines=[];let cur='';
  pieces.forEach(p=>{const t=cur?cur+' '+p:p;if(!cur||tw(t,size,bold)<=w)cur=t;else{lines.push(cur);cur=p}});
  if(cur)lines.push(cur);
  return lines.length?lines:[''];
}
function buildPdf(v){
  const r=reportData(v),PW=595,PH=842,M=40,W=PW-2*M,pages=[];
  let cur,y;
  const newPage=()=>{cur=[];pages.push(cur);y=PH-M};
  const T=(x,yy,s,size,bold)=>{cur.push('BT /'+(bold?'F2':'F1')+' '+size+' Tf '+x.toFixed(1)+' '+yy.toFixed(1)+' Td ('+pdfStr(s)+') Tj ET')};
  const L=yy=>{cur.push('0.6 G 0.5 w '+M+' '+yy.toFixed(1)+' m '+(M+W)+' '+yy.toFixed(1)+' l S')};
  const R=(yy,h)=>{cur.push('0.92 g '+M+' '+yy.toFixed(1)+' '+W+' '+h+' re f 0 g')};
  const P=(s,size,bold,gap)=>{wrapText(s,W,size,bold).forEach(l=>{if(y-size*1.3<M)newPage();y-=size*1.3;T(M,y,l,size,bold)});y-=gap||0};
  const KV=(k,val,bold)=>{if(y-14<M)newPage();y-=14;T(M+3,y,k,10,bold);T(M+W-3-tw(val,10,bold),y,val,10,bold);L(y-4)};
  newPage();
  P(vname(v)+(v.allestimento?' '+v.allestimento:''),16,true,2);
  P('Targa: '+(v.targa||'-')+(v.vin?' · VIN: '+v.vin:'')+' · Anno: '+(v.anno||'-')+' · '+v.alimentazione+' · '+num(v.km,0)+' km (agg. '+fdate(v.kmData)+')',10,false,2);
  if(r.ai){P(r.ai.txt,10,false,0);if(r.as)P('Pagato finora: '+eur(r.as.tot),10,true,2)}
  y-=8;P('Riepilogo costi sostenuti',12,true,4);
  GROUPS.forEach(g=>KV(g[1],eur(r.s.by[g[0]]),false));
  KV('Totale',eur(r.s.total),true);
  y-=10;P('Storico manutenzioni',12,true,6);
  if(!r.list.length)P('Nessun intervento registrato.',10,false,0);
  else{
    const cols=[['Data',58],['Interventi',200],['Km',48],['Officina',92],['Fattura',55],['Costo',62]];
    const header=()=>{if(y-18<M)newPage();R(y-14,16);let x=M;cols.forEach(c=>{T(x+3,y-10,c[0],9,true);x+=c[1]});y-=16;L(y)};
    const row=cells=>{
      const ls=cells.map((c,i)=>wrapText(c,cols[i][1]-6,9,false));
      const n=Math.max.apply(null,ls.map(a=>a.length)),h=n*11+6;
      if(y-h<M){newPage();header()}
      let x=M;
      ls.forEach((a,i)=>{a.forEach((t,k)=>T(x+3,y-10-k*11,t,9,false));x+=cols[i][1]});
      y-=h;L(y);
    };
    header();
    r.list.forEach(e=>row([fdate(e.data),expTitle(e)+((e.interventi&&e.interventi.length&&e.voce)?' - '+e.voce:''),e.km?num(e.km,0):'',e.officina||'',e.fattura||'',eur(e.costo)]));
    y-=8;P('Totale manutenzione: '+eur(r.list.reduce((t,e)=>t+(e.costo||0),0)),10,true,6);
  }
  y-=6;P('Generato il '+fdate(todayISO())+' con Garage Manager v'+VERSION,8,false,0);
  const objs=[];
  objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
  objs[2]='<< /Type /Pages /Kids ['+pages.map((p,i)=>(5+i*2)+' 0 R').join(' ')+'] /Count '+pages.length+' >>';
  objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  pages.forEach((p,i)=>{
    const st=p.join('\n');
    objs[5+i*2]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+(6+i*2)+' 0 R >>';
    objs[6+i*2]='<< /Length '+st.length+' >>\nstream\n'+st+'\nendstream';
  });
  let out='%PDF-1.4\n';const off=[];
  for(let i=1;i<objs.length;i++){off[i]=out.length;out+=i+' 0 obj\n'+objs[i]+'\nendobj\n'}
  const xr=out.length;
  out+='xref\n0 '+objs.length+'\n0000000000 65535 f \n';
  for(let i=1;i<objs.length;i++)out+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  out+='trailer\n<< /Size '+objs.length+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF';
  const bytes=new Uint8Array(out.length);
  for(let i=0;i<out.length;i++)bytes[i]=out.charCodeAt(i)&255;
  return new Blob([bytes],{type:'application/pdf'});
}
/* Stampa / PDF: apre il report in PDF in una nuova scheda (poi si stampa o si salva dal visualizzatore del dispositivo).
   Se il browser blocca la nuova scheda, scarica il file. */
function printPdf(){
  const v=curV();if(!v)return;
  let blob;
  try{blob=buildPdf(v)}catch(e){console.error(e);toast('Errore nella creazione del PDF');return}
  const url=URL.createObjectURL(blob);
  let w=null;
  try{w=window.open(url,'_blank')}catch(e){}
  if(!w){download(blob,'report-'+(v.targa||v.modello).replace(/\s+/g,'_')+'-'+todayISO()+'.pdf');toast('Scheda bloccata dal browser: ho scaricato il PDF, aprilo da lì')}
  setTimeout(()=>URL.revokeObjectURL(url),120000);
}

/* ---------- eventi ---------- */
const A={
  closeModal:closeModal,
  addVehicle:()=>vehicleForm(),
  editVehicle:d=>vehicleForm(d.id),
  kmUpdate:d=>kmForm(d.id),
  delVehicle:d=>{const v=db.vehicles.find(x=>x.id===d.id);if(!confirm('Eliminare '+vname(v)+' e tutto il suo storico?'))return;
    db.vehicles=db.vehicles.filter(x=>x.id!==d.id);['expenses','fuelLogs','rules'].forEach(k=>{db[k]=db[k].filter(x=>x.vehicleId!==d.id)});save();render();toast('Veicolo eliminato')},
  regTab:d=>{ui.reg=d.v;render()},
  addMan:()=>expenseForm(null,'man'),addAltre:()=>expenseForm(null,'altre'),editExp:d=>expenseForm(d.id),
  delExp:d=>{if(confirm('Eliminare questa spesa?')){db.expenses=db.expenses.filter(x=>x.id!==d.id);save();render()}},
  addFuel:()=>fuelForm(),editFuel:d=>fuelForm(d.id),
  delFuel:d=>{if(confirm('Eliminare questa voce di carburante?')){db.fuelLogs=db.fuelLogs.filter(x=>x.id!==d.id);save();render()}},
  addPart:()=>{
    const i=$('#newPart'),box=$('#partsBox');
    if(!i||!box)return;
    const p=i.value.trim();
    if(!p)return;
    const ex=Array.prototype.slice.call(box.querySelectorAll('input')).find(x=>x.value.toLowerCase()===p.toLowerCase());
    if(ex)ex.checked=true;else box.insertAdjacentHTML('beforeend',partChk(p,true));
    i.value='';i.focus();
  },
  addRule:()=>ruleForm(),editRule:d=>ruleForm(d.id),doneRule:d=>doneForm(d.id),
  delRule:d=>{if(confirm('Eliminare questa regola?')){db.rules=db.rules.filter(x=>x.id!==d.id);save();render()}},
  presets:()=>{const v=curV();if(!confirm('Aggiungere '+PRESETS.length+' regole suggerite (modificabili) a '+vname(v)+'?\nI conteggi partono da oggi e dai km attuali.'))return;
    PRESETS.forEach(p=>db.rules.push({id:uid(),vehicleId:v.id,nome:p[0],ogniKm:p[1],ogniMesi:p[2],ultimoKm:v.km,ultimaData:todayISO()}));save();render();toast('Regole aggiunte')},
  exportJson:exportJson,
  importJson:()=>{$('#fileIn').value='';$('#fileIn').click()},
  exportCsv:exportCsv,printReport:printPdf,
  sortSet:d=>{if(d.w==='fuel')ui.sortFuel=d.v;else ui.sortSpese=d.v;render()},
  sortRule:d=>{ui.sortRegole=d.v;render()},
  resetAll:()=>{if(confirm('Cancellare TUTTI i dati? Questa azione non si può annullare.\n\nHai scaricato un backup?')){db=emptyDb();ui.vid=null;save();render();toast('Dati cancellati')}}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');
  if(t){ui.tab=t.dataset.tab;render();window.scrollTo(0,0);return}
  const a=e.target.closest('[data-act]');
  if(a&&A[a.dataset.act])A[a.dataset.act](a.dataset);
});
document.addEventListener('change',e=>{
  if(e.target.id==='vsel'){ui.vid=e.target.value;render()}
  else if(e.target.id==='fileIn'&&e.target.files[0])importFile(e.target.files[0]);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  else if(e.key==='Enter'&&e.target.id==='newPart'){e.preventDefault();A.addPart()}
});
/* blocco totale dello zoom (iOS Safari ignora user-scalable=no) */
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
$('#ver').textContent='v'+VERSION;
render();
</script>
